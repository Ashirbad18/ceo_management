services:
  - type: web
    name: cmas-ceo-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CMAS_SECRET_KEY
        generateValue: true
      - key: CMAS_DEMO_DATA
        value: "0"
      - key: DATABASE_URL
        value: sqlite:///./data/cmas.db
